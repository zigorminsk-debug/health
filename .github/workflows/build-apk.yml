name: Build APK

on:
  push:
    branches: [main, "arena/**"]
    paths-ignore:
      - "**.md"
      - "uploads/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать GitHub Release с готовым APK"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & sign APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JS syntax check
        run: |
          node --check bud-zdorov/js/app.js
          node --check bud-zdorov/js/data.js
          node --check bud-zdorov/sw.js
          echo "JS syntax OK"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools (zip, ImageMagick)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zip imagemagick

      - name: Set up Android SDK (build-tools 30.0.3)
        run: |
          # свежий cmdline-tools в temp (в репозитории лежит копия без прав +x)
          CT="$RUNNER_TEMP/ct"
          mkdir -p "$CT"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$CT/tools.zip"
          unzip -q "$CT/tools.zip" -d "$CT"
          mv "$CT/cmdline-tools" "$CT/latest"
          chmod +x "$CT/latest/bin/"* 2>/dev/null || true
          yes | "$CT/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          # platforms;android-30 уже лежит в репозитории — докачиваем только build-tools
          "$CT/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;30.0.3" > /dev/null
          ls "$ANDROID_HOME/build-tools/30.0.3" | head

      - name: Build APK
        run: bash build-apk.sh
        env:
          BUDZDOROV_KS_PASS: ${{ secrets.BUDZDOROV_KS_PASS }}
          BUDZDOROV_KEYSTORE_B64: ${{ secrets.BUDZDOROV_KEYSTORE_B64 }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BudZdorov-apk
          path: BudZdorov.apk
          if-no-files-found: error

      - name: Short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.sha.outputs.short }}
          name: "ZI Medical tests — APK build ${{ github.run_number }} (${{ steps.sha.outputs.short }})"
          body: |
            Автоматическая сборка APK из коммита ${{ github.sha }}.
            Устанавливайте поверх текущей версии (тот же подписной ключ).
          files: BudZdorov.apk
          make_latest: true
